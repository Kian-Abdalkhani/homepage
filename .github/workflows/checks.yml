name: Homepage CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, build, and browser checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://forgejo.abdalkhani.com/api/packages/abdalkhani-homelab/npm/
          scope: '@abdalkhani'
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.FORGEJO_PACKAGES_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add the FORGEJO_PACKAGES_TOKEN repository secret with read access to the Abdalkhani design-kit packages."
            exit 1
          fi
          npm ci
      - name: Lint
        run: npm run lint
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Build and test
        run: npm run test:browser
      - name: Save browser reports and screenshots
        if: always() && !cancelled()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: homepage-browser-results
          path: |
            playwright-report/
            test-results/
            artifacts/homepage-*.png
          if-no-files-found: ignore
          retention-days: 7

  publish_image:
    name: Build and publish container image
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE_NAME: forgejo.abdalkhani.com/abdalkhani-homelab/homepage
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check publishing configuration
        env:
          REGISTRY_USERNAME: ${{ vars.FORGEJO_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_TOKEN" ]; then
            echo "::error::Set the FORGEJO_USERNAME variable and FORGEJO_REGISTRY_TOKEN secret with permission to push images under abdalkhani-homelab."
            exit 1
          fi
      - name: Prepare npm configuration
        run: |
          umask 077
          cat > "$RUNNER_TEMP/homepage.npmrc" <<'EOF'
          //forgejo.abdalkhani.com/api/packages/abdalkhani-homelab/npm/:_authToken=${FORGEJO_TOKEN}
          EOF
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Forgejo
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: forgejo.abdalkhani.com
          username: ${{ vars.FORGEJO_USERNAME }}
          password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
      - name: Set image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: |
            npmrc=${{ runner.temp }}/homepage.npmrc
          secrets: |
            forgejo_token=${{ secrets.FORGEJO_PACKAGES_TOKEN }}
      - name: Record deployment digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Published image: `%s@%s`\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary npm configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/homepage.npmrc"
